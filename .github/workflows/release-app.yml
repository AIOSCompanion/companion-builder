name: Companion Go app release builds

# New app only. The existing Electron workflow and updater feed are unchanged.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed version tag in the private companion-engine repository
        required: true
        type: string
      expected_sha:
        description: Optional immutable tag-object SHA; a moved tag is refused
        required: false
        default: ''
        type: string
      allow_unsigned_macos_test:
        description: Explicitly create a labelled UNSIGNED macOS test draft instead of signing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: companion-go-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  identity:
    if: github.repository == 'AIOSCompanion/companion-builder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}
      tag_object_sha: ${{ steps.identity.outputs.tag_object_sha }}
      release_repository: ${{ steps.identity.outputs.release_repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Import the team public log key
        env:
          TEST_LOG_PUBLIC_KEY: ${{ vars.TEST_LOG_PUBLIC_KEY }}
        run: printf '%s\n' "$TEST_LOG_PUBLIC_KEY" | gpg --batch --import >/dev/null 2>&1
      - name: Create a read-only source identity token
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}
          owner: AIOSCompanion
          repositories: companion-engine
          permission-contents: read
      # The destination is one builder variable, so the owner's choice of repository is a single setting.
      - name: Verify the immutable source tag and the configured public destination
        id: identity
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          APP_RELEASE_REPOSITORY: ${{ vars.APP_RELEASE_REPOSITORY }}
        run: python3 -I -B scripts/app_release_identity.py
      - name: Create or verify the isolated unpublished draft
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_RELEASES_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.commit_sha }}
          APP_RELEASE_REPOSITORY: ${{ steps.identity.outputs.release_repository }}
          UNSIGNED_MACOS_TEST: ${{ inputs.allow_unsigned_macos_test }}
          LOG_RECIPIENT: ${{ vars.TEST_LOG_RECIPIENT }}
        run: >-
          python3 -I -B scripts/run_sealed.py --name create-app-draft
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python3 -I -B scripts/app_release.py draft
      - name: Retain only encrypted identity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-app-identity
          path: ${{ runner.temp }}/app-release-logs/*.gpg
          retention-days: 1
          if-no-files-found: ignore

  # Windows and macOS are separate jobs, not one matrix: GitHub sends a job's runner every secret that job
  # references, and the Windows job runs code that never runs on macOS (npm install scripts, go run, Windows-only
  # packages). It must never hold the Apple signing secrets, so none is referenced anywhere in it.
  build-windows:
    name: Windows x64 (unsigned)
    needs: identity
    runs-on: windows-2022
    environment: release-signing
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ needs.identity.outputs.commit_sha }}
      TAG_OBJECT_SHA: ${{ needs.identity.outputs.tag_object_sha }}
      APP_SOURCE_DIR: ${{ github.workspace }}/source
      UNSIGNED_MACOS_TEST: ${{ inputs.allow_unsigned_macos_test }}
      LOG_RECIPIENT: ${{ vars.TEST_LOG_RECIPIENT }}
      GOTOOLCHAIN: local
    steps:
      - name: Check out the trusted public builder at this workflow commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect the trusted scripts before any private code is present
        run: python -I -B scripts/app_release_snapshot.py "$RUNNER_TEMP/trusted"
      - name: Import the team public log key
        env:
          TEST_LOG_PUBLIC_KEY: ${{ vars.TEST_LOG_PUBLIC_KEY }}
        run: printf '%s\n' "$TEST_LOG_PUBLIC_KEY" | gpg --batch --import >/dev/null 2>&1
      - name: Create a read-only source checkout token
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}
          owner: AIOSCompanion
          repositories: companion-engine
          permission-contents: read
      - name: Check out private source at the validated immutable commit
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name checkout-private-app
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" checkout
      - name: Create a read-only bundled resource checkout token
        id: resource-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}
          owner: AIOSCompanion
          repositories: aios-desktop-app
          permission-contents: read
      - name: Check out the pinned bundled MCP source
        env:
          GH_TOKEN: ${{ steps.resource-token.outputs.token }}
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name checkout-resources
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" checkout-resources
      # Go is pinned by the source's go.mod (toolchain line, else go line); Node comes from the UI's engines.
      - name: Read the Go and Node versions the pinned source asks for
        id: toolchain
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name app-toolchain
          --log-dir "$RUNNER_TEMP/app-release-logs" --export-output go_version --export-output node_version --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" toolchain
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}
      - name: Recheck the checkout, exact tag and toolchain before building
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name app-source-preflight
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" preflight
      - name: Build without publisher or signing credentials
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name build-app
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" build --platform windows-amd64
      - name: Set up the .NET SDK used by the pinned ARC Desktop source
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/companion-dotnet9
        with:
          dotnet-version: '9.0.321'
      - name: Build and stage the native Windows MCP resources
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name stage-mcp-resources
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" resources --platform windows-amd64
      - name: Verify the packaged Windows window and resident engine in a fresh home
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name verify-windows-app
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" check-windows
      - name: Bind only the expected downloadable assets to this source commit
        env:
          APP_ASSET_DIR: ${{ runner.temp }}/app-release-assets
          # Read-only and public: names the destination so staging can copy the newest published pointer.
          APP_RELEASE_REPOSITORY: ${{ needs.identity.outputs.release_repository }}
          # The job's own read-only token, only for those public API reads. Anonymous calls hit GitHub's shared
          # 60-an-hour limit on hosted runners. It cannot write to the destination, and read_public sends it to
          # api.github.com alone. No publishing or signing credential is given to this step.
          PUBLIC_READ_TOKEN: ${{ github.token }}
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name stage-app-assets
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" stage --platform windows-amd64
      - name: Verify trusted scripts before publication
        run: python -I -B "$RUNNER_TEMP/trusted/snapshot_trusted.py" verify --dest "$RUNNER_TEMP/trusted"
      - name: Publish only verified assets to the unpublished new-app draft
        env:
          APP_ASSET_DIR: ${{ runner.temp }}/app-release-assets
          GH_TOKEN: ${{ secrets.PUBLISH_RELEASES_TOKEN }}
          APP_RELEASE_REPOSITORY: ${{ needs.identity.outputs.release_repository }}
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name upload-app-assets
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" upload --platform windows-amd64
      - name: Verify the trusted snapshot before retaining logs
        if: always()
        run: python -I -B "$RUNNER_TEMP/trusted/snapshot_trusted.py" verify --dest "$RUNNER_TEMP/trusted"
      - name: Retain encrypted logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-app-windows-amd64
          path: ${{ runner.temp }}/app-release-logs/*.gpg
          retention-days: 1
          if-no-files-found: ignore

  build-macos:
    name: macOS arm64 (Developer ID signed, notarised, stapled)
    needs: identity
    runs-on: macos-15
    environment: release-signing
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ needs.identity.outputs.commit_sha }}
      TAG_OBJECT_SHA: ${{ needs.identity.outputs.tag_object_sha }}
      APP_SOURCE_DIR: ${{ github.workspace }}/source
      UNSIGNED_MACOS_TEST: ${{ inputs.allow_unsigned_macos_test }}
      LOG_RECIPIENT: ${{ vars.TEST_LOG_RECIPIENT }}
      GOTOOLCHAIN: local
    steps:
      - name: Check out the trusted public builder at this workflow commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Protect the trusted scripts before any private code is present
        run: python -I -B scripts/app_release_snapshot.py "$RUNNER_TEMP/trusted"
      - name: Import the team public log key
        env:
          TEST_LOG_PUBLIC_KEY: ${{ vars.TEST_LOG_PUBLIC_KEY }}
        run: printf '%s\n' "$TEST_LOG_PUBLIC_KEY" | gpg --batch --import >/dev/null 2>&1
      - name: Create a read-only source checkout token
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}
          owner: AIOSCompanion
          repositories: companion-engine
          permission-contents: read
      - name: Check out private source at the validated immutable commit
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name checkout-private-app
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" checkout
      - name: Create a read-only bundled resource checkout token
        id: resource-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.BUILDER_APP_ID }}
          private-key: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}
          owner: AIOSCompanion
          repositories: aios-desktop-app
          permission-contents: read
      - name: Check out the pinned bundled MCP source
        env:
          GH_TOKEN: ${{ steps.resource-token.outputs.token }}
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name checkout-resources
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" checkout-resources
      # Go is pinned by the source's go.mod (toolchain line, else go line); Node comes from the UI's engines.
      - name: Read the Go and Node versions the pinned source asks for
        id: toolchain
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name app-toolchain
          --log-dir "$RUNNER_TEMP/app-release-logs" --export-output go_version --export-output node_version --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" toolchain
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.go_version }}
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}
      - name: Recheck the checkout, exact tag and toolchain before building
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name app-source-preflight
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" preflight
      - name: Build without publisher or signing credentials
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name build-app
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" build --platform darwin-arm64
      - name: Build and stage the native macOS MCP resources
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name stage-mcp-resources
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" resources --platform darwin-arm64
      # The built app runs here, in a step without signing material, and never in the signing step.
      - name: Check the macOS bundle version without credentials
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name check-macos-bundle
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" check-macos
      # The only step with the Apple secrets. It runs Apple's tools and this builder's scripts, nothing built.
      - name: Sign notarize and staple the macOS arm64 bundle
        if: ${{ !inputs.allow_unsigned_macos_test }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name sign-notarize-app
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" sign-macos
      - name: Package the explicitly requested unsigned macOS test build
        if: inputs.allow_unsigned_macos_test
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name unsigned-macos-test
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" unsigned-macos
      - name: Bind only the expected downloadable assets to this source commit
        env:
          APP_ASSET_DIR: ${{ runner.temp }}/app-release-assets
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name stage-app-assets
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" stage --platform darwin-arm64
      - name: Verify trusted scripts before publication
        run: python -I -B "$RUNNER_TEMP/trusted/snapshot_trusted.py" verify --dest "$RUNNER_TEMP/trusted"
      - name: Publish only verified assets to the unpublished new-app draft
        env:
          APP_ASSET_DIR: ${{ runner.temp }}/app-release-assets
          GH_TOKEN: ${{ secrets.PUBLISH_RELEASES_TOKEN }}
          APP_RELEASE_REPOSITORY: ${{ needs.identity.outputs.release_repository }}
        run: >-
          python -I -B "$RUNNER_TEMP/trusted/run_sealed.py" --name upload-app-assets
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python -I -B "$RUNNER_TEMP/trusted/app_release.py" upload --platform darwin-arm64
      - name: Verify the trusted snapshot before retaining logs
        if: always()
        run: python -I -B "$RUNNER_TEMP/trusted/snapshot_trusted.py" verify --dest "$RUNNER_TEMP/trusted"
      - name: Retain encrypted logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-app-darwin-arm64
          path: ${{ runner.temp }}/app-release-logs/*.gpg
          retention-days: 1
          if-no-files-found: ignore

  finalize:
    needs: [identity, build-windows, build-macos]
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Import the team public log key
        env:
          TEST_LOG_PUBLIC_KEY: ${{ vars.TEST_LOG_PUBLIC_KEY }}
        run: printf '%s\n' "$TEST_LOG_PUBLIC_KEY" | gpg --batch --import >/dev/null 2>&1
      - name: Finalize verified draft metadata while retaining owner publication
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_RELEASES_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.identity.outputs.commit_sha }}
          APP_RELEASE_REPOSITORY: ${{ needs.identity.outputs.release_repository }}
          UNSIGNED_MACOS_TEST: ${{ inputs.allow_unsigned_macos_test }}
          LOG_RECIPIENT: ${{ vars.TEST_LOG_RECIPIENT }}
        run: >-
          python3 -I -B scripts/run_sealed.py --name finalize-app-draft
          --log-dir "$RUNNER_TEMP/app-release-logs" --
          python3 -I -B scripts/app_release.py finalize
      - name: Retain encrypted finalization logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealed-app-finalize
          path: ${{ runner.temp }}/app-release-logs/*.gpg
          retention-days: 1
          if-no-files-found: ignore
