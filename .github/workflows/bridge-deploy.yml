name: Deploy the authenticated build event bridge

on:
  workflow_dispatch:
    inputs:
      enable:
        description: Enable event acceptance after credential setup and review
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: bridge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: bridge-deploy
    timeout-minutes: 10
    steps:
      - name: Require the trusted builder main branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test event routing and delivery before deploying
        run: node --test bridge/worker.test.mjs
      - name: Deploy the bridge without printing credentials or payloads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BRIDGE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.BRIDGE_CLOUDFLARE_ACCOUNT_ID }}
          BRIDGE_APP_ID: ${{ vars.BRIDGE_APP_ID }}
          BRIDGE_APP_PRIVATE_KEY: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
          BRIDGE_WEBHOOK_SECRET: ${{ secrets.BRIDGE_WEBHOOK_SECRET }}
          BRIDGE_STATUS_TOKEN: ${{ secrets.BRIDGE_STATUS_TOKEN }}
          BRIDGE_ENABLED: ${{ inputs.enable }}
        run: python3 -I -B scripts/deploy_bridge.py
