name: Builder self-check

# Public builder code only. No private checkout, signing secret, or product release.
on:
  push:
    branches: [main, alamin-builder-ready]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the public workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Test the builder and validate workflow contracts
        run: python -m unittest discover -s tests -v
