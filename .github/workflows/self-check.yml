name: Builder self-check

# Public builder code only. No private checkout, signing secret, or product release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the public workflow parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 pytest==8.4.2
      - name: Test the builder and validate workflow contracts
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test signed event delivery, routing and durable retries
        run: node --test bridge/worker.test.mjs
      - name: Exercise signed HTTP delivery, SQLite restart recovery and durable retries
        working-directory: bridge
        run: node --test portable.test.mjs

  isolation:
    name: Prove hosted Linux isolation with public synthetic data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create the disposable test checkout
        run: |
          mkdir -p smoke-checkout/graphs
          printf 'VALUE = 7\n' > smoke-checkout/graphs/builder_public_graph_probe.py
      - name: Prepare the test user
        run: python -I -B scripts/prepare_untrusted.py --checkout smoke-checkout --home "$HOME"
      - name: Snapshot trusted scripts
        run: python -I -B scripts/snapshot_trusted.py snapshot --dest "$RUNNER_TEMP/trusted"
      - name: Prove network isolation with calibration
        run: python -I -B "$RUNNER_TEMP/trusted/egress_probe.py"
      - name: Protect the trusted hosted tools
        run: python -I -B "$RUNNER_TEMP/trusted/protect_runtime.py"
      - name: Reproduce the sealed-log directory created by a real dependency install
        run: mkdir -p "$RUNNER_TEMP/sealed/logs"
      - name: Prove write isolation and report runner-file permissions
        run: python -I -B "$RUNNER_TEMP/trusted/permission_probe.py" --trusted "$RUNNER_TEMP/trusted" --workdir smoke-checkout --workspace "$GITHUB_WORKSPACE" --path "$PATH" --home "$HOME" --require-runner-denials
      - name: Verify snapshot integrity
        run: python -I -B "$RUNNER_TEMP/trusted/snapshot_trusted.py" verify --dest "$RUNNER_TEMP/trusted"
      - name: Verify detached test helpers are reaped before sealed output closes
        working-directory: smoke-checkout
        run: python -I -B "$RUNNER_TEMP/trusted/gpg_smoke.py" --suite-guard

  sealed-output:
    name: Sealed output on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real encryption without private data or persistent keys
        run: python scripts/gpg_smoke.py

  app-release-snapshot:
    name: Protect release snapshot on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calibrate trusted-script protection using public synthetic files only
        run: python -I -B scripts/app_snapshot_smoke.py

  app-release-runner:
    name: Calibrate app release checks on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove the packaged-window and macOS archive checks with known-good and negative controls
        run: python -I -B scripts/app_runner_calibration.py
